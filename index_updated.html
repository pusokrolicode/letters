<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get well soon 🌷</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ee;--bg2:#ffc9dd;--card:rgba(255,255,255,.72);--text:#5b2a42;--accent:#e0527f;--petal1:#ff9ec0;--petal2:#ffc2d8;--cat:#b9a9c9;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#2a1523;--bg2:#4a2038;--card:rgba(60,28,48,.7);--text:#ffe3ee;--accent:#ff8fb3;--petal1:#d1668f;--petal2:#a84a72;--cat:#9d8db0}
}
:root[data-theme="dark"]{--bg1:#2a1523;--bg2:#4a2038;--card:rgba(60,28,48,.7);--text:#ffe3ee;--accent:#ff8fb3;--petal1:#d1668f;--petal2:#a84a72;--cat:#9d8db0}
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;-webkit-text-size-adjust:100%}
body{font-family:"Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow:hidden;position:relative}
.stage{position:relative;height:100%;display:flex;align-items:center;justify-content:center;padding:16px 18px calc(150px + env(safe-area-inset-bottom,0px))}
.card{position:relative;z-index:3;max-width:440px;width:100%;background:var(--card);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:28px;padding:30px 26px;text-align:center;box-shadow:0 12px 40px rgba(224,82,127,.22);animation:pop 1.1s cubic-bezier(.2,.9,.3,1.2) both}
.card h1{margin:0 0 12px;font-size:clamp(24px,6.5vw,32px);color:var(--accent);line-height:1.15}
.card p{margin:0 0 10px;font-size:clamp(16px,4.4vw,18px);line-height:1.55;font-weight:600}
.card p.sub{font-weight:400;opacity:.85;margin:0}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.94)}to{opacity:1;transform:none}}
.petal{position:fixed;top:-30px;z-index:2;border-radius:150% 0 150% 0;opacity:.85;animation:fall linear infinite;pointer-events:none}
@keyframes fall{0%{transform:translate3d(0,-30px,0) rotate(0)}50%{transform:translate3d(40px,55vh,0) rotate(200deg)}100%{transform:translate3d(-30px,110vh,0) rotate(420deg)}}
.heart{position:fixed;bottom:-30px;z-index:1;color:var(--accent);opacity:0;animation:rise linear infinite;pointer-events:none}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.7}100%{opacity:0;transform:translateY(-85vh) scale(1.1)}}
.garden{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;align-items:flex-end;gap:0;padding:0 8px env(safe-area-inset-bottom,0px);pointer-events:none}
.garden svg{display:block;flex:0 0 auto;height:auto;overflow:visible}
.fl{width:calc(clamp(38px,10.5vw,92px) * var(--k,1));transform-box:fill-box;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate;animation-delay:var(--d,0s)}
@keyframes sway{from{transform:rotate(-3.5deg)}to{transform:rotate(3.5deg)}}
.cat{width:clamp(88px,21vw,160px);--cat:#1d1b24;filter:drop-shadow(0 0 1.5px rgba(255,255,255,.4))}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tail{transform-box:view-box;transform-origin:102px 112px;animation:tail 2.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 6s infinite}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-8deg)}}
.cheart{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.25) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.petal,.heart,.fl,.blink,.tail,.ear,.cheart{animation:none}.petal{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="tulip" viewBox="0 0 100 200">
      <path d="M50 100 L50 200" stroke="#5aa36a" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 170 Q20 160 22 130 Q46 140 50 170Z" fill="#6fbf7f"/>
      <path d="M50 150 Q80 145 80 118 Q54 124 50 150Z" fill="#5aa36a"/>
      <path d="M28 40 Q26 98 50 104 Q74 98 72 40 L61 56 L50 32 L39 56Z" fill="#ff7fa8"/>
      <path d="M50 32 L39 56 Q36 90 50 104 Q64 90 61 56Z" fill="#ff9ec0"/>
    </symbol>
    <symbol id="rose" viewBox="0 0 100 200">
      <path d="M50 100 L50 200" stroke="#5aa36a" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 165 Q20 158 22 132 Q46 140 50 165Z" fill="#6fbf7f"/>
      <path d="M50 140 Q80 134 78 112 Q54 118 50 140Z" fill="#5aa36a"/>
      <circle cx="50" cy="68" r="30" fill="#e0527f"/>
      <circle cx="50" cy="68" r="22" fill="#ea6a92" stroke="#c23a68" stroke-width="2"/>
      <path d="M50 68 m-13 0 a13 13 0 1 1 13 13" fill="none" stroke="#c23a68" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M50 68 m-6 0 a6 6 0 1 1 6 6" fill="none" stroke="#c23a68" stroke-width="2.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="lily" viewBox="0 0 100 200">
      <path d="M50 90 L50 200" stroke="#5aa36a" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 175 Q18 165 20 135 Q46 145 50 175Z" fill="#6fbf7f"/>
      <g fill="#fff2f7" stroke="#f3a8c3" stroke-width="1.5">
        <ellipse cx="50" cy="42" rx="10" ry="30"/>
        <ellipse cx="50" cy="42" rx="10" ry="30" transform="rotate(60 50 72)"/>
        <ellipse cx="50" cy="42" rx="10" ry="30" transform="rotate(120 50 72)"/>
        <ellipse cx="50" cy="42" rx="10" ry="30" transform="rotate(180 50 72)"/>
        <ellipse cx="50" cy="42" rx="10" ry="30" transform="rotate(240 50 72)"/>
        <ellipse cx="50" cy="42" rx="10" ry="30" transform="rotate(300 50 72)"/>
      </g>
      <g stroke="#e0527f" stroke-width="2" stroke-linecap="round">
        <path d="M50 72 L40 52"/><path d="M50 72 L50 46"/><path d="M50 72 L60 52"/>
      </g>
      <g fill="#ff9f43"><circle cx="40" cy="51" r="3"/><circle cx="50" cy="45" r="3"/><circle cx="60" cy="51" r="3"/></g>
    </symbol>
  </defs>
</svg>

<main class="stage">
  <section class="card">
    <h1>Get well soon 🌷</h1>
    <p>Rest up, drink some tea, and get better soon. It’s just not the same without your good mood. 💗</p>
    <p class="sub">Until then, this cat has your back.</p>
    <div class="cat-message">
      <p class="cat-label">A little message from the cat 🐾</p>
      <p>This kitty wishes you a speedy recovery and hopes to see you healthy and happy again very soon. 💗</p>
    </div>
  </section>
</main>

<div class="garden" aria-hidden="true">
  <svg class="fl" style="--k:.95;--d:-.4s" viewBox="0 0 100 200"><use href="#tulip"/></svg>
  <svg class="fl" style="--k:1.1;--d:-1.8s" viewBox="0 0 100 200"><use href="#rose"/></svg>
  <svg class="fl" style="--k:1.25;--d:-2.6s" viewBox="0 0 100 200"><use href="#lily"/></svg>

  <svg class="cat" viewBox="0 0 140 130">
    <path class="tail" d="M102 112 Q136 112 128 76" fill="none" stroke="var(--cat)" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="70" cy="98" rx="34" ry="30" fill="var(--cat)"/>
    <ellipse cx="54" cy="124" rx="11" ry="6" fill="var(--cat)" stroke="#fff" stroke-opacity=".35"/>
    <ellipse cx="86" cy="124" rx="11" ry="6" fill="var(--cat)" stroke="#fff" stroke-opacity=".35"/>
    <g class="ear"><polygon points="46,40 50,14 68,30" fill="var(--cat)"/><polygon points="52,34 53,22 62,30" fill="#ff9ec0"/></g>
    <polygon points="94,40 90,14 72,30" fill="var(--cat)"/><polygon points="88,34 87,22 78,30" fill="#ff9ec0"/>
    <circle cx="70" cy="54" r="27" fill="var(--cat)"/>
    <ellipse class="blink" cx="59" cy="54" rx="3.8" ry="5.2" fill="#ffd54a"/>
    <ellipse class="blink" cx="81" cy="54" rx="3.8" ry="5.2" fill="#ffd54a"/>
    <circle cx="60" cy="52" r="1.2" fill="#fff"/><circle cx="82" cy="52" r="1.2" fill="#fff"/>
    <path d="M67 62 L73 62 L70 66Z" fill="#ff7fa8"/>
    <path d="M70 66 Q66 71 62 68 M70 66 Q74 71 78 68" fill="none" stroke="#ffb3c9" stroke-width="1.4" stroke-linecap="round"/>
    <g stroke="#e9dff0" stroke-opacity=".7" stroke-width="1" stroke-linecap="round">
      <path d="M52 64 L36 60"/><path d="M52 67 L36 69"/><path d="M88 64 L104 60"/><path d="M88 67 L104 69"/>
    </g>
    <circle cx="52" cy="62" r="4" fill="#ff9ec0" opacity=".5"/><circle cx="88" cy="62" r="4" fill="#ff9ec0" opacity=".5"/>
    <path class="cheart" d="M70 12 C62 4 54 12 70 24 C86 12 78 4 70 12Z" fill="#e0527f" transform="translate(0 -6) scale(.8) translate(17 0)"/>
  </svg>

  <svg class="fl" style="--k:1.25;--d:-.9s" viewBox="0 0 100 200"><use href="#lily"/></svg>
  <svg class="fl" style="--k:1.1;--d:-2.2s" viewBox="0 0 100 200"><use href="#tulip"/></svg>
  <svg class="fl" style="--k:.95;--d:-3.1s" viewBox="0 0 100 200"><use href="#rose"/></svg>
</div>

<script>
(function(){
  var b=document.body, i, el;
  var cols=["var(--petal1)","var(--petal2)"];
  for(i=0;i<22;i++){
    el=document.createElement("div");
    el.className="petal";
    var s=10+Math.random()*12;
    el.style.cssText="left:"+(Math.random()*100)+"vw;width:"+s+"px;height:"+(s*1.3)+"px;background:"+cols[i%2]+";animation-duration:"+(9+Math.random()*9)+"s;animation-delay:"+(-Math.random()*16)+"s";
    b.appendChild(el);
  }
  for(i=0;i<8;i++){
    el=document.createElement("div");
    el.className="heart";
    el.textContent="♥";
    el.style.cssText="left:"+(5+Math.random()*90)+"vw;font-size:"+(14+Math.random()*14)+"px;animation-duration:"+(8+Math.random()*7)+"s;animation-delay:"+(-Math.random()*12)+"s";
    b.appendChild(el);
  }
})();
</script>
</body>
</html>
